name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Godot Unsigned iOS Builder
        uses: gamekiller2048/Godot-Unsigned-IOS@v2.0.1
        with:
          godot-version: '4.3'        # Match your Godot version
          godot-flavor: 'stable'
          export-name: 'sobosuba'     # Match your project export name
          configuration: 'release'
