name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      dropbox_link:
        description: 'Download link for the Xcode project zip'
        required: true
        default: ''

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Godot Unsigned iOS Builder
        uses: gamekiller2048/Godot-Unsigned-IOS@v2.0.1
        with:
          godot-version: '4.3' # Change to your Godot version if needed (e.g., 4.2.1, 4.3, etc.)
          godot-flavor: 'stable'
          export-name: 'sobosuba'
          configuration: 'release'
          dropbox-link: ${{ github.event.inputs.dropbox_link }}
