- name: Godot-Unsigned-IOS
  # You may pin to the exact commit or the version.
  # uses: gamekiller2048/Godot-Unsigned-IOS@f6de848b8b57d799fde69d2d40eea24c9a490c44
  uses: gamekiller2048/Godot-Unsigned-IOS@v2.0.1
  with:
    # The version of Godot downloaded.
    godot-version: # optional, default is 4.7.1
    # The flavor of Godot downloaded.
    godot-flavor: # optional, default is stable
    # The name of the Xcode project and generated IPA.
    export-name: sobosuba # optional, default is my-ios-project
    # The configuration of both the godot export and xcode build. Can be release|debug.
    configuration: # optional, default is release
